services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: citofonia-postgres
    environment:
      POSTGRES_DB: citofonia
      POSTGRES_USER: citofonia
      POSTGRES_PASSWORD: citofonia_dev
    ports:
      - '5432:5432'
    volumes:
      - citofonia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U citofonia -d citofonia' ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  citofonia-pgdata:
