spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/citofonia}
    username: ${DB_USERNAME:citofonia}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      enabled: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:8h}
      issuer: citofonia-api
    bootstrap:
      admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
      admin-first-name: ${BOOTSTRAP_ADMIN_FIRST_NAME:Administrador}
      admin-last-name: ${BOOTSTRAP_ADMIN_LAST_NAME:Sistema}
      admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
