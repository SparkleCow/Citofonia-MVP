spring:
  application:
    name: citofonia
  profiles:
    default: dev
  jpa:
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  panic:
    # Codigo de seguridad de la alerta general / emergencias. Solo se valida en el servidor.
    # En produccion definir PANIC_ALERT_CODE.
    code: ${PANIC_ALERT_CODE:2222}
  push:
    # Push via Expo (requiere build con projectId de EAS y credenciales FCM/APNs).
    enabled: ${PUSH_ENABLED:false}
    expo-url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
