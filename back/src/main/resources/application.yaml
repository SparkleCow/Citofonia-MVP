spring:
  application:
    name: citofonia
  profiles:
    default: dev
  jpa:
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

app:
  panic:
    # Codigo que hay qbn'798nkmbnbnbAQue teclear para lanzar la alerta general a todos los residentes.
    code: ${PANIC_ALERT_CODE:123}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}
